name: native_hf libcint tests

on:
  push:
    branches: [main]
    paths:
      - "dense_evolution/native_hf/**"
      - "tests/unit/test_native_hf_libcint_gradient.py"
      - ".github/scripts/build-libcint.sh"
      - ".github/workflows/native-hf-libcint.yml"
  pull_request:
    branches: [main]
    paths:
      - "dense_evolution/native_hf/**"
      - "tests/unit/test_native_hf_libcint_gradient.py"
      - ".github/scripts/build-libcint.sh"
      - ".github/workflows/native-hf-libcint.yml"

jobs:
  libcint:
    name: libcint gradient (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build libcint and the driver
        run: bash .github/scripts/build-libcint.sh
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy jax jaxlib basis_set_exchange psutil pytest pytest-cov pytest-env
          pip install -e . --no-deps
      - name: Run libcint tests
        run: pytest tests/unit/test_native_hf_libcint_gradient.py --noconftest -p no:randomly -o addopts="" -v --cov=dense_evolution --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
