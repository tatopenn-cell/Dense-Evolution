name: Randomized collection order (diagnostic)

# Moved out of ci.yml: the serial run of the whole suite in random order takes
# about 15 minutes, which kept the pull-request check above the 20-minute rule.
# It is a diagnostic (it never gated a merge), so it runs every week and on demand.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  randomized:
    name: Randomized order (Python 3.12, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-env pytest-xdist pytest-randomly numpy scipy pandas matplotlib psutil ipython seaborn plotly
          pip install setuptools pytest pytest-cov pytest-env pytest-xdist pytest-randomly numpy scipy pandas matplotlib psutil ipython jax jaxlib seaborn plotly
          pip install qiskit pennylane pylatexenc
          pip install basis_set_exchange
          pip install qiskit-ibm-runtime
          pip install stim
          pip install pymatching
          pip install rdkit
          pip install ase
          pip install scikit-learn
          pip install dense-armor
          pip install "streamlit>=1.30.0" "ipywidgets>=8.0.0"
          pip install fastapi uvicorn pydantic httpx2
          pip install mcp httpx
          pip install -e . --no-deps


      - name: Run test suite with randomized collection order
        run: |
          pytest tests/ -v --tb=short
