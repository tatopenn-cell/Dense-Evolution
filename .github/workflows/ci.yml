name: CI — Dense Evolution Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # code == true whenever anything OTHER than docs/mkdocs config
          # changed -- a pure docs/*.md-only PR doesn't need the full
          # 6-way (2 OS x 3 Python) matrix rerunning the whole suite,
          # just the handful of tests that actually exec docs code blocks.
          #
          # predicate-quantifier MUST be "every" (AND across patterns), not
          # paths-filter's own default "some" (OR) -- under "some", a file
          # only needs to match ONE of the patterns below to count, and '**'
          # matches every file unconditionally, so with the default quantifier
          # the two '!'-exclusions never excluded anything: `code` evaluated
          # true for every single change, docs-only included (verified: a
          # pure docs/examples.md edit still set `code=true`, running the
          # full 6-way matrix and skipping the docs-only fast path -- the
          # exact opposite of this job's purpose). "every" requires a file to
          # match '**' AND NOT match 'docs/**' AND NOT match 'mkdocs.yml' to
          # count as code, which is what an include-everything-except-these
          # pattern list actually needs.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!mkdocs.yml'
              - '!README.md'

  rag-dense:
    name: RAG dense retrieval (sentence-transformers, own job)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install setuptools pytest pytest-env numpy scipy pandas matplotlib psutil ipython jax jaxlib seaborn plotly
          pip install scikit-learn sentence-transformers
          pip install -e . --no-deps
      - name: Run the retrieval tests
        env:
          GLIBC_TUNABLES: glibc.rtld.optional_static_tls=2000000
        run: |
          pytest tests/unit/test_ia_utils_rag.py -v --tb=short -p no:randomly

  docs-examples:
    name: Docs examples (docs-only change)
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          # plotly: tests/integration/conftest.py's autouse fixture imports
          # dashboard_core, which imports band_structure.py (import plotly.
          # graph_objects at module level) -- this job's own install list
          # never had it, so ANY docs-only change hitting this fast path
          # (not just the incidental 0-diff push that first surfaced this)
          # would fail here with ModuleNotFoundError: no module named 'plotly'.
          # rdkit: same fixture also imports dashboard_core.qmmm, which
          # imports dense_evolution/qmmm/region.py (import rdkit at module
          # level) -- same class of gap, surfaced by a docs-only PR touching
          # this fast path (#303), fixed the same way.
          # basis_set_exchange: same fixture also imports dashboard_core's
          # native_hf_diagnostics.py (import basis_set_exchange at module
          # level) -- same class of gap again, surfaced by PR #307.
          pip install pytest numpy jax jaxlib pennylane psutil matplotlib plotly rdkit basis_set_exchange
          pip install -e . --no-deps
      - run: pytest tests/integration/test_docs_examples.py -v --tb=short

  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    needs: changes
    runs-on: ${{ needs.changes.outputs.code == 'true' && matrix.os || 'ubuntu-latest' }}

    strategy:
      fail-fast: false # Impedisce che il fallimento di una versione di Python blocchi le altre
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-env pytest-xdist pytest-randomly numpy scipy pandas matplotlib psutil ipython seaborn plotly
          pip install setuptools pytest pytest-cov pytest-env pytest-xdist pytest-randomly numpy scipy pandas matplotlib psutil ipython jax jaxlib seaborn plotly
          pip install qiskit pennylane pylatexenc
          pip install basis_set_exchange # dashboard_core.hamiltonians' native_hf fallback (e.g. Si2 -- PennyLane's own STO-3G table stops at Ne)
          pip install qiskit-ibm-runtime # tests/integration/test_interop_calibration_noise.py -- FakeSherbrooke, real historical IBM Eagle-127 calibration data, offline/no account needed
          pip install stim # tests/integration/test_interop_stim_bridge.py -- to_stim() correctness tests were being silently skipped in CI without this (pytest.importorskip), leaving the real logic uncovered
          pip install pymatching # tests/unit/test_qec.py::TestPymatchingDecode -- pymatching_decode's real MWPM logic, not just the "missing package" ImportError path, needs the actual package installed here (same reasoning as stim above)
          pip install rdkit # tests/unit/test_qmmm.py -- real region-partitioning correctness, not just the ImportError path (same reasoning as stim/pymatching above)
          pip install ase # tests/unit/test_qmmm.py::TestAseBridge -- real ASE Calculator correctness, not just the ImportError path (same reasoning as rdkit/pyscf above)
          if [ "${{ matrix.os }}" != "macos-latest" ]; then pip install scikit-learn; fi
          # sentence-transformers (torch) is installed in the job rag-dense, in its own process: the bundled
          # libgomp copies of torch and scikit-learn exhaust glibc's static TLS when loaded together
          # ("cannot allocate memory in static TLS block"), which turned the whole matrix red from 2026-10-18.
          # tests/unit/test_ia_utils_rag.py -- real TF-IDF/dense-embedding/cross-encoder retrieval, not just the
          # ImportError path (same reasoning as stim/pymatching/pyscf/rdkit above), ubuntu only: sentence-transformers
          # pulls in torch, and installing it alongside JAX on the macos-latest runners here triggered a real, full
          # xdist worker crash cascade ("node down: Not properly terminated" spreading across unrelated test files
          # until "maximum crashed workers reached") -- macOS CI here has a documented history of exactly this kind
          # of native-library instability (see the composer extra's own comment above re: qiskit). Skipped rather
          # than debugged blind on a platform this session has no way to reproduce locally; test_ia_utils_rag.py's
          # model-dependent tests just skip on macOS via pytest.importorskip, same as pyscf would on an OS without a wheel.
          pip install dense-armor # tests/unit/test_native_hf_engine.py::TestEnergyHistory -- real Hampel/Tukey anomaly detection on the real SCF energy trace, not just the ImportError path (same reasoning as rdkit/pyscf/ase above)
          pip install streamlit>=1.30.0 ipywidgets>=8.0.0
          pip install fastapi uvicorn pydantic httpx2 # composer extra -- local_site/app/server.py + tests/integration/test_local_site_server.py (httpx2: starlette.testclient's current required client)
          pip install mcp httpx # mcp extra -- mcp_server/server.py + tests/integration/test_mcp_server.py (real httpx, not the httpx2 alias above -- the MCP adapter imports httpx directly)
          pip install -e . --no-deps # Installa il pacchetto locale in modalita' editable:
          # con un'installazione normale (`pip install .`), i sorgenti finiscono
          # copiati dentro site-packages e i test importano QUELLA copia, non i
          # file nella working directory che coverage.py osserva con --cov=. --
          # risultato: 0.0% anche con i test che passano davvero, perche' le
          # righe eseguite e le righe misurate sono in due file fisicamente
          # diversi. Confermato nel log della CI stessa: "TOTAL 4009 4009 0.0%"
          # gia' nello step di test, prima ancora di generare coverage.xml --
          # non era un bug di Codecov.

      - name: Run test suite
        if: needs.changes.outputs.code == 'true'
        # -n auto (pytest-xdist): splits the suite across the runner's own
        # CPU cores, each in its own process -- measured locally (8-core
        # machine, tests/unit only): -n 4 cut an ~885s serial run to
        # ~536s (0 new failures, same 0-failure/21-skipped result), not
        # linear speedup (JAX/XLA per-worker startup cost and uneven test
        # sizes eat into it) but a real, verified win. The distributed-
        # chunk step below stays serial deliberately -- it forces an
        # 8-simulated-device JAX device mesh via XLA_FLAGS, and forking
        # that across multiple xdist worker processes is a separate
        # question this change doesn't touch.
        #
        # -p no:randomly: pytest-randomly (installed above for the
        # dedicated step further down, prog.txt test-suite audit issue
        # #269 point 9) auto-activates and randomizes collection order the
        # moment it's importable, with no flag needed -- this keeps the
        # main suite's ordering exactly as before until the dedicated
        # step's findings are addressed.
        run: |
          pytest tests/ -n auto -p no:randomly -v --tb=short --junitxml=pytest-results.xml --cov=. --cov-report=term-missing

      - name: Generate combined coverage report
        if: needs.changes.outputs.code == 'true'
        # Runs after both pytest invocations above so coverage.xml reflects
        # their merged .coverage data (via --cov-append), not just whichever
        # one happened to write the XML last.
        #
        # --ignore-errors: test_docs_examples.py execs code blocks pulled
        # straight out of docs/examples.md under a synthetic filename
        # (e.g. "docs/examples.md::## Density-matrix ZNE healing") for
        # coverage tracing -- there's no real file on disk at that path,
        # so plain `coverage xml` aborts outright trying to re-read it
        # ("No source for code"). This run failed silently on exactly
        # that (confirmed in the job log) and the commit never reached
        # Codecov at all, not even as a 0%-coverage upload -- worse than
        # the original bug, not a regression in what was already fixed.
        run: |
          coverage xml --ignore-errors

      - name: Upload coverage report
        if: needs.changes.outputs.code == 'true' && (matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: needs.changes.outputs.code == 'true' && (matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest')
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        # Tokenless upload (previous commit) ruled out: still 0% hits with
        # correct totals/structure either way. Token restored here after
        # re-syncing CODECOV_TOKEN with the org's current token (it may
        # have gone stale after a prior regeneration on Codecov's side
        # without updating this secret) -- ruling that specific mismatch
        # in/out too, now that both are confirmed to match.

      - name: Upload test results on failure
        if: needs.changes.outputs.code == 'true' && (failure())
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-results*.xml

  slow:
    name: Slow tests (Python 3.12, ubuntu-latest, own job)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The tests marked @pytest.mark.slow run here, in parallel with the matrix, so the
    # matrix itself runs only "not slow" (pyproject.toml addopts) and each check stays
    # under 20 minutes. The coverage of this job is uploaded to Codecov next to the one
    # of the matrix; Codecov merges the two reports of the same commit.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-env pytest-xdist pytest-randomly numpy scipy pandas matplotlib psutil ipython seaborn plotly
          pip install setuptools pytest pytest-cov pytest-env pytest-xdist pytest-randomly numpy scipy pandas matplotlib psutil ipython jax jaxlib seaborn plotly
          pip install qiskit pennylane pylatexenc
          pip install basis_set_exchange
          pip install qiskit-ibm-runtime
          pip install stim
          pip install pymatching
          pip install rdkit
          pip install ase
          pip install scikit-learn
          pip install dense-armor
          pip install "streamlit>=1.30.0" "ipywidgets>=8.0.0"
          pip install fastapi uvicorn pydantic httpx2
          pip install mcp httpx
          pip install -e . --no-deps


      - name: Run distributed-chunk tests (simulated multi-device)
        # TestChunkDistributed needs >= 8 JAX devices; the count is fixed at process
        # start, so this step has its own pytest process with XLA_FLAGS, serial.
        env:
          XLA_FLAGS: "--xla_force_host_platform_device_count=8"
        run: |
          pytest tests/unit/test_chunk.py -k TestChunkDistributed -m slow -p no:randomly -v --tb=short --junitxml=pytest-results-distributed.xml --cov=. --cov-report=term-missing

      - name: Run slow tests (excluded by default -- see pyproject.toml addopts)
        # -n auto: the slow tests are spread over the cores of the runner, as the main
        # suite is. -k excludes the class that already has its own step above.
        run: |
          pytest tests/ -m slow -k "not TestChunkDistributed" -n auto -p no:randomly -v --tb=short --junitxml=pytest-results-slow.xml --cov=. --cov-append --cov-report=term-missing

      - name: Generate coverage report
        run: |
          coverage xml --ignore-errors

      - name: Upload slow-test coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: slow
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-slow
          path: pytest-results*.xml
