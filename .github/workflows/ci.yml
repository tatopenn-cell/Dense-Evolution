name: CI — Dense Evolution Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # Impedisce che il fallimento di una versione di Python blocchi le altre
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy pandas matplotlib psutil ipython seaborn plotly
          pip install setuptools pytest numpy scipy pandas matplotlib psutil ipython jax jaxlib seaborn plotly
          pip install qiskit pennylane
          pip install streamlit>=1.30.0 ipywidgets>=8.0.0
          pip install . --no-deps # Installa il pacchetto locale

      - name: Run test suite
        run: |
          pytest test_dense_evolution.py test_ia_healing.py test_dashboard_core.py test_ai_middleware.py test_interop.py test_autodiff.py test_quantum_scars.py test_mitigation.py test_mps.py test_mitigation_runner.py test_interactive_panel.py -v --tb=short --junitxml=pytest-results.xml

      - name: Run distributed-chunk tests (simulated multi-device)
        # TestChunkDistributed (issue #1) needs >= 8 JAX devices to exercise
        # anything beyond a skip -- JAX's device count is fixed at process
        # start, so this needs its own pytest invocation with the env var
        # set beforehand, not just a flag inside the test run above.
        env:
          XLA_FLAGS: "--xla_force_host_platform_device_count=8"
        run: |
          pytest test_dense_evolution.py -k TestChunkDistributed -v --tb=short --junitxml=pytest-results-distributed.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results*.xml
