name: CI — Dense Evolution Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # Impedisce che il fallimento di una versione di Python blocchi le altre
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy scipy pandas matplotlib psutil ipython seaborn plotly
          pip install setuptools pytest pytest-cov numpy scipy pandas matplotlib psutil ipython jax jaxlib seaborn plotly
          pip install qiskit pennylane
          pip install streamlit>=1.30.0 ipywidgets>=8.0.0
          pip install . --no-deps # Installa il pacchetto locale

      - name: Run test suite
        run: |
          pytest tests/ -v --tb=short --junitxml=pytest-results.xml --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        # No token: Codecov's dashboard says this org no longer requires an
        # upload token (tokenless upload via the GitHub App/OIDC instead).
        # Coverage.xml itself was already confirmed correct (right package
        # structure, right paths, right totals) but Codecov's dashboard
        # still showed 0% hits everywhere for a token-based upload -- an
        # internal inconsistency (its own line_coverage array disagreed
        # with its own totals for the same report) that token removal is
        # worth ruling in/out as the cause.

      - name: Run distributed-chunk tests (simulated multi-device)
        # TestChunkDistributed (issue #1) needs >= 8 JAX devices to exercise
        # anything beyond a skip -- JAX's device count is fixed at process
        # start, so this needs its own pytest invocation with the env var
        # set beforehand, not just a flag inside the test run above.
        env:
          XLA_FLAGS: "--xla_force_host_platform_device_count=8"
        run: |
          pytest tests/test_chunk.py -k TestChunkDistributed -v --tb=short --junitxml=pytest-results-distributed.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-results*.xml
