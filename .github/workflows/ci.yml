name: CI — Dense Evolution Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # Impedisce che il fallimento di una versione di Python blocchi le altre
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy scipy pandas matplotlib psutil ipython seaborn plotly
          pip install setuptools pytest pytest-cov numpy scipy pandas matplotlib psutil ipython jax jaxlib seaborn plotly
          pip install qiskit pennylane
          pip install streamlit>=1.30.0 ipywidgets>=8.0.0
          pip install -e . --no-deps # Installa il pacchetto locale in modalita' editable:
          # con un'installazione normale (`pip install .`), i sorgenti finiscono
          # copiati dentro site-packages e i test importano QUELLA copia, non i
          # file nella working directory che coverage.py osserva con --cov=. --
          # risultato: 0.0% anche con i test che passano davvero, perche' le
          # righe eseguite e le righe misurate sono in due file fisicamente
          # diversi. Confermato nel log della CI stessa: "TOTAL 4009 4009 0.0%"
          # gia' nello step di test, prima ancora di generare coverage.xml --
          # non era un bug di Codecov.

      - name: Run test suite
        run: |
          pytest tests/ -v --tb=short --junitxml=pytest-results.xml --cov=. --cov-report=term-missing

      - name: Run distributed-chunk tests (simulated multi-device)
        # TestChunkDistributed (issue #1) needs >= 8 JAX devices to exercise
        # anything beyond a skip -- JAX's device count is fixed at process
        # start, so this needs its own pytest invocation with the env var
        # set beforehand, not just a flag inside the test run above.
        #
        # --cov-append is the point: without it, this step's coverage data
        # would just overwrite the main suite's instead of merging into it,
        # and the multi-device-only code paths in chunk.py (the whole
        # reason this step exists as a separate process) would go right
        # back to looking untested in the report -- confirmed this was
        # actually happening: chunk.py showed 95.9% in an earlier full
        # local run that covered both, but only 69.2% from CI's coverage.xml
        # once the 0%-coverage bug above was fixed and the real number
        # could finally be read, because this step wasn't feeding into it.
        env:
          XLA_FLAGS: "--xla_force_host_platform_device_count=8"
        run: |
          pytest tests/test_chunk.py -k TestChunkDistributed -v --tb=short --junitxml=pytest-results-distributed.xml --cov=. --cov-append --cov-report=term-missing

      - name: Generate combined coverage report
        # Runs after both pytest invocations above so coverage.xml reflects
        # their merged .coverage data (via --cov-append), not just whichever
        # one happened to write the XML last.
        #
        # --ignore-errors: test_docs_examples.py execs code blocks pulled
        # straight out of docs/examples.md under a synthetic filename
        # (e.g. "docs/examples.md::## Density-matrix ZNE healing") for
        # coverage tracing -- there's no real file on disk at that path,
        # so plain `coverage xml` aborts outright trying to re-read it
        # ("No source for code"). This run failed silently on exactly
        # that (confirmed in the job log) and the commit never reached
        # Codecov at all, not even as a 0%-coverage upload -- worse than
        # the original bug, not a regression in what was already fixed.
        run: |
          coverage xml --ignore-errors

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        # Tokenless upload (previous commit) ruled out: still 0% hits with
        # correct totals/structure either way. Token restored here after
        # re-syncing CODECOV_TOKEN with the org's current token (it may
        # have gone stale after a prior regeneration on Codecov's side
        # without updating this secret) -- ruling that specific mismatch
        # in/out too, now that both are confirmed to match.

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest-results*.xml
