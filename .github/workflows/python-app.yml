name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurazione ambiente Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Installazione dipendenze e Dense-Evolution core
      run: |
        python -m pip install --upgrade pip
        python -m pip install jax jaxlib ipython dense-evolution

    - name: Esecuzione test logici e stabilità simulatore (Beast Mode)
      run: |
        python -c "
        import numpy as np
        import jax
        import jax.numpy as jnp
        import dense_evolution as de

        num_qubits = 2
        base_ops = [('h', 0), ('cx', 0, 1)]

        sim = de.DenseSVSimulator(n_qubits=num_qubits, use_gpu=False, use_float32=False)

        np.random.seed(42)
        batch_params = np.random.uniform(0, 2 * np.pi, (5, 4))
        jax_batch = jnp.array(batch_params, dtype=jnp.float64)

        statevectors = sim.run_parametric_batch_jit(base_ops, jax_batch)
        jax.block_until_ready(statevectors)

        print(f'Test completato. Forma dell output: {statevectors.shape}')
        
        # Correzione del bug logico sull asserzione della forma
        batch_size = statevectors.shape[0]
        assert batch_size == 5, f'Errore nella dimensione del batch: trovati {batch_size}'
        "

    - name: Esecuzione suite di test automatizzati
      run: |
        if [ -d "tests" ] || [ -f "test_dense.py" ]; then pytest; else echo "Nessun file pytest trovato."; fi


