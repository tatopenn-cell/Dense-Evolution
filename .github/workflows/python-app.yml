name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurazione ambiente Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Installazione dipendenze e Dense-Evolution core
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install qiskit pandas numpy jax jaxlib pytest
        pip install -e .

    - name: Esecuzione test logici e stabilità simulatore (Beast Mode)
      run: |
        python -c "
        import dense_evolution as de
        sim = de.DenseSVSimulator(n_qubits=2)
        ops = [['h', 0, -1], ['cx', 1, 0]]
        sim.run_circuit_jit_beast_mode(ops)
        print('✅ Stato quantistico calcolato:', sim.get_statevector())
        print('🚀 Core Engine V4 Ultra: Test completato con successo!')
        "

    - name: Esecuzione suite di test automatizzati
      run: |
        if [ -d "tests" ] || [ -f "test_dense.py" ]; then pytest; else echo "⚠️ Nessun file pytest trovato, salto la suite."; fi
