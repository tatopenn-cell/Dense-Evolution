name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurazione ambiente Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Installazione dipendenze e Dense-Evolution core
      run: |
        python -m pip install dense-evolution

    - name: Esecuzione test logici e stabilità simulatore (Beast Mode)
      run: |
        python -c "
       import jax
import dense_evolution as de

sim = de.DenseSVSimulator(n_qubits=2, use_gpu=False, use_float32=False)
circuit = [["h", 0, -1], ["cx", 0, 1]]

statevector = sim.run_circuit_jit_beast_mode(circuit)
print(f"Stato Finale Entangled JIT: {statevector}")
print(f"Probabilità di estrazione: {sim.get_probabilities()}")
        "

    - name: Esecuzione suite di test automatizzati
      run: |
        if [ -d "tests" ] || [ -f "test_dense.py" ]; then pytest; else echo "⚠️ Nessun file pytest trovato, salto la suite."; fi
