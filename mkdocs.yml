site_name: Dense-Evolution — JAX NISQ Quantum Circuit Simulator
site_description: Dense-Evolution is a high-performance, JAX XLA-accelerated NISQ statevector quantum circuit simulator for VQE, QML, and Zero-Noise Extrapolation workloads.
site_url: https://tatopenn-cell.github.io/Dense-Evolution/
repo_url: https://github.com/tatopenn-cell/Dense-Evolution
repo_name: tatopenn-cell/Dense-Evolution
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    logo: material/atom
  favicon: assets/favicon.svg

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - assets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            heading_level: 2

nav:
  - Home: index.md
  - Composer: composer.md
  - MCP Server: mcp.md
  - Getting Started: getting-started.md
  - Examples: examples.md
  - Benchmarks: benchmarks.md
  - API Reference:
      - api/index.md
      - Simulator: api/simulator.md
      - MPS Simulator: api/mps.md
      - Chunk (large-scale): api/chunk.md
      - QASM Parser: api/parser.md
      - Compiler: api/compiler.md
      - Registry & Noise Models: api/registry.md
      - Gates: api/gates.md
      - Mitigation (ZNE / density-matrix diagnostics): api/mitigation.md
      - Healing (predictive primitives): api/healing.md
      - IA Utils — Vector Healing: api/ia_utils_vector_healing.md
      - IA Utils — Adversarial Vector Attack: api/ia_utils_adversarial_vector_attack.md
      - Interop (Qiskit / PennyLane): api/interop.md
      - Autodiff: api/autodiff.md
      - Topology (entangling layers): api/topology.md
      - States (GHZ, ...): api/states.md
      - Observables (Pauli expectation): api/observables.md
      - Measurement (sampling & fidelity): api/measurement.md
      - QFT: api/qft.md
      - Random Circuit: api/random_circuit.md
      - Drawing (text diagrams): api/drawing.md
      - Harrison Tight-Binding (universal): api/harrison_tb.md
      - VHD Tight-Binding (material-specific): api/vhd_tb.md
      - Fermions (Majorana Jordan-Wigner): api/fermions.md
      - Entropy (partial trace, mutual information): api/entropy.md
      - Trotter (Hamiltonian evolution as gates): api/trotter.md
      - Native Hartree-Fock (Obara-Saika, JAX): api/native_hf.md
      - QEC (erasure-aware stabilizer decoding): api/qec.md
      - "Dashboard Core — Wormhole (SYK teleportation)": api/dashboard_core_wormhole.md
      - "Dashboard Core — VQE": api/dashboard_core_vqe.md
      - "Dashboard Core — Hamiltonians": api/dashboard_core_hamiltonians.md
      - "Dashboard Core — QM/MM": api/dashboard_core_qmmm.md
      - "Dashboard Core — Mitigation (ZNE panel)": api/dashboard_core_mitigation.md
      - "Dashboard Core — Vector Healing (healing panel)": api/dashboard_core_vector_healing.md
      - "Dashboard Core — Engine": api/dashboard_core_engine.md
      - "Dashboard Core — QASM Library": api/dashboard_core_qasm_library.md
      - "Dashboard Core — System Limits": api/dashboard_core_system_limits.md
      - "Dashboard Core — Circuit Diagram": api/dashboard_core_circuit_diagram.md
      - "Dashboard Core — State Visuals": api/dashboard_core_state_visuals.md
      - "Dashboard Core — Visuals": api/dashboard_core_visuals.md
      - "Dashboard Core — Graphical Builder": api/dashboard_core_graphical_builder.md
      - "Dashboard Core — Circuit Builder Component": api/dashboard_core_circuit_builder_component.md
  - Changelog: changelog.md
