[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-evolution"
version = "8.0.0"
description = "A micro-optimized, high-performance NISQ Statevector Quantum Simulator using JAX XLA Kernel Fusion."
readme = "README.md"
authors = [
    { name = "Salvatore Pennacchio", email = "jtatopenn@libero.it" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 :: Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics"
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0"
]
gpu = [
    "cupy-cuda12x>=12.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dense_evolution*"]
