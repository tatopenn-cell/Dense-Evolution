[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-evolution"
version = "8.1.0"
description = "Micro-optimized High-Performance NISQ Statevector Quantum Circuit Simulator (Hardware-Adaptive Integration of Native NumPy, CUDA-Accelerated CuPy, and Linear Kernel Fusion via JAX JIT/XLA Compilation)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Business Source License 1.1" }
authors = [
    { name = "Salvatore Pennacchio", email = "jtatopenn@libero.it" }
]
keywords = [
    "quantum-computing", 
    "quantum-simulation", 
    "statevector", 
    "jax", 
    "cupy", 
    "cuda-acceleration", 
    "openqasm", 
    "nisq-noise", 
    "hpc", 
    "linear-kernel-fusion",
    "dashboard",
    "visualization"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

# Dipendenze core necessarie per il funzionamento base e i moduli di telemetria/grafica
dependencies = [
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.0", 
    "jaxlib>=0.4.0"
]
gpu = [
    "cupy-cuda12x>=12.0.0"
]
dashboard = [
    "dash>=2.0.0",
    "plotly>=5.0.0"
]
full = [
    "jax>=0.4.0", 
    "jaxlib>=0.4.0", 
    "cupy-cuda12x>=12.0.0",
    "dash>=2.0.0",
    "plotly>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/tatopenn-cell/Dense-Evolution"
Documentation = "https://github.com/tatopenn-cell/Dense-Evolution/blob/main/LICENSE"
Repository = "https://github.com/tatopenn-cell/Dense-Evolution"
"Bug Tracker" = "https://github.com/tatopenn-cell/Dense-Evolution/blob/main/dense_evolution.py"



[tool.setuptools]
packages = ["dense_evolution"]
py-modules = ["dash"]

[tool.setuptools.package-data]
"dense_evolution" = ["compiler.py", "gates.py", "parser.py", "registry.py","chunk.py","healing.py","simulator.py", "__init__.py"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
