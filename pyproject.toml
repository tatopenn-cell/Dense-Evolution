
[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-evolution"
version = "8.0.0"
description = "A micro-optimized, high-performance NISQ statevector quantum circuit simulator with JAX and CuPy acceleration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Salvatore Pennacchio", email = "jtatopenn@libero.it" }
]
keywords = [
    "quantum", "quantum-computing", "quantum-simulator", "statevector", 
    "jax", "cupy", "cuda-acceleration", "openqasm", "nisq-noise", "hpc"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "numpy>=1.22.0"
]

[project.optional-dependencies]
gpu = ["cupy>=12.0.0"]
jax = ["jax>=0.4.0", "jaxlib>=0.4.0"]
dev = ["pytest>=7.0.0", "black>=23.0.0"]

[project.urls]
Homepage = "https://github.com"
Documentation = "https://github.com#readme"
Repository = "https://github.com.git"
Bug-Tracker = "https://github.com/issues"

[tool.setuptools]
py-modules = ["dense_evolution"]
