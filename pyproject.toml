[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-evolution"
version = "8.0.0"
description = "A micro-optimized, high-performance NISQ Statevector Quantum Simulator using JAX XLA Kernel Fusion."
readme = "README.md"
authors = [
    { name = "Salvatore Pennacchio", email = "jtatopenn@libero.it" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 :: Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics"
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0"
]
gpu = [
    "cupy-cuda12x>=12.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dense_evolution*"]
[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-evolution"
version = "8.0.0"
description = "Micro-optimized High-Performance NISQ Statevector Quantum Circuit Simulator (Hardware-Adaptive Integration of Native NumPy, CUDA-Accelerated CuPy, and Linear Kernel Fusion via JAX JIT/XLA Compilation)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Salvatore Pennacchio", email = "jtatopenn@libero.it" }
]
keywords = [
    "quantum-computing", 
    "quantum-simulation", 
    "statevector", 
    "jax", 
    "cupy", 
    "cuda-acceleration", 
    "openqasm", 
    "nisq-noise", 
    "hpc", 
    "linear-kernel-fusion"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "numpy>=1.22.0"
]

[project.optional-dependencies]
gpu = ["cupy>=12.0.0"]
jax = ["jax>=0.4.0", "jaxlib>=0.4.0"]
full = ["cupy>=12.0.0", "jax>=0.4.0", "jaxlib>=0.4.0"]

[project.urls]
Homepage = "https://github.com/tatopenn-cell/Dense-Evolution"
Documentation = "https://github.com/tatopenn-cell/Dense-Evolution/blob/main/README.md"
Repository = "https://github.com/tatopenn-cell/Dense-Evolution"
Bug-Tracker = "https://github.com/tatopenn-cell/Dense-Evolution/blob/main/dense_evolution.py"

# pyproject.toml Summary





py-modules = ["dense_evolution"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
