[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-evolution"
version = "8.1.43"
description = "Micro-optimized High-Performance NISQ Statevector Quantum Circuit Simulator (Hardware-Adaptive Integration of Native NumPy, CUDA-Accelerated CuPy, and Linear Kernel Fusion via JAX JIT/XLA Compilation)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Business Source License 1.1" }
authors = [
    { name = "Salvatore Pennacchio", email = "jtatopenn@libero.it" }
]
keywords = [
    "quantum-computing",
    "quantum-simulation",
    "statevector",
    "jax",
    "cupy",
    "cuda-acceleration",
    "openqasm",
    "nisq-noise",
    "hpc",
    "linear-kernel-fusion",
    "dashboard",
    "visualization"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "psutil>=5.9.0",
    "scipy>=1.9.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0"
]

[project.optional-dependencies]
jax = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0"
]
gpu = [
    "cupy-cuda12x>=12.0.0"
]
dashboard = [
    "streamlit>=1.30.0",
    "plotly>=5.0.0",
    "pandas>=1.5.0",
    "seaborn>=0.12.0",
    "ipywidgets>=8.0.0"
]
qiskit = [
    "qiskit>=1.0.0"
]
pennylane = [
    "pennylane>=0.35.0"
]
full = [
    "cupy-cuda12x>=12.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.0.0",
    "pandas>=1.5.0",
    "seaborn>=0.12.0",
    "qiskit>=1.0.0",
    "pennylane>=0.35.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
    "ruff>=0.4.0"
]

[project.urls]
Homepage = "https://github.com/tatopenn-cell/Dense-Evolution"
Documentation = "https://github.com/tatopenn-cell/Dense-Evolution/blob/main/README.md"
Repository = "https://github.com/tatopenn-cell/Dense-Evolution"
"Bug Tracker" = "https://github.com/tatopenn-cell/Dense-Evolution/issues"

[tool.setuptools]
packages = ["dense_evolution", "ia_utils", "dashboard_core", "ui_pages"]

[tool.setuptools.package-data]
"dense_evolution" = ["*.py"]
"ia_utils" = ["*.py"]
"dashboard_core" = ["*.py"]
"ui_pages" = ["*.py"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.coverage.run]
# A single repo-root source (not three separate --cov=<pkg> roots): three
# separate sources each became their own flattened "." package in
# coverage.xml, so every file lost its directory prefix
# (filename="autodiff.py" instead of "dense_evolution/autodiff.py") --
# confirmed to actually collide for the three __init__.py files, which
# all landed under one identical <class filename="__init__.py"> entry.
# Codecov can't map a bare "autodiff.py" back to a real path in the git
# tree, so the upload "succeeds" but attributes 0% despite local runs
# reporting ~90%. The pytest invocation (.github/workflows/ci.yml) must
# pass `--cov=.` to match this source=["."].
#
# `include` does NOT work here -- pytest-cov builds its own Coverage()
# scope straight from `--cov=.` and ignores this key (confirmed: ui_pages
# and app_dashboard.py still showed up in the report with it set) -- so
# scoping to the three packages this project actually tracks has to go
# through `omit` instead, which pytest-cov does honor regardless of how
# `--cov` was passed.
source = ["."]
omit = [
    "tests/*", "experiments/*", "app_dashboard.py", "ui_pages/*",
    "legacy/*", "build/*", "dist/*", "notebooks/*",
]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
precision = 1
